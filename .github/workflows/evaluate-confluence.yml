name: Evaluate Confluence pages

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: confluence-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run evaluation tests
        run: python -m unittest discover -s tests -v

      - name: Evaluate Confluence pages
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL || 'https://bcphackaton.atlassian.net' }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL || 'auto' }}
        run: python -m scripts.evaluate_confluence
